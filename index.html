<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a73e8' width='192' height='192' rx='32'/><text x='96' y='120' text-anchor='middle' fill='white' font-size='80' font-family='sans-serif'>💊</text></svg>">
<title>药物结构背诵</title>
<style>
:root {
  --body-bg: linear-gradient(160deg,#e9effb 0%,#ece9f7 45%,#e3ecfa 100%);
  --bg: #edf1f9; --surface: rgba(255,255,255,0.45);
  --text: #262d40; --text2: #59627a;
  --primary: #5b6cf0; --primary-dark: #4a5bd8; --primary-light: #e8ebff;
  --accent: #8b5cf6; --accent-light: #f1edff;
  --danger: #ef4444; --danger-light: #feecec;
  --success: #10b981; --success-light: #e7faf2;
  --warn: #f59e0b; --warn-light: #fdf4e3;
  --star: #f5a623;
  --border: rgba(255,255,255,0.55);
  --glass-blur: blur(14px) saturate(130%);
  --shadow: 0 8px 28px rgba(88,104,190,0.10);
  --shadow-soft: 0 2px 10px rgba(88,104,190,0.06);
  --radius: 18px; --radius-sm: 12px;
  --nav-h: 72px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',system-ui,sans-serif;
}
body.dark {
  --body-bg: linear-gradient(160deg,#181b2a 0%,#1d1c30 45%,#171b2a 100%);
  --bg: #1a1f31; --surface: rgba(255,255,255,0.07);
  --text: #e7eaf4; --text2: #a5abc4;
  --primary: #8b9bff; --primary-dark: #7184f5; --primary-light: #232a4d;
  --accent: #a78bfa; --accent-light: #2a2444;
  --danger: #f87171; --danger-light: #3a2230;
  --success: #34d399; --success-light: #133a32;
  --warn: #fbbf24; --warn-light: #3a2f1c;
  --border: rgba(255,255,255,0.14);
  --shadow: 0 8px 28px rgba(0,0,0,0.35);
  --shadow-soft: 0 2px 10px rgba(0,0,0,0.25);
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:var(--font); background:var(--body-bg); color:var(--text);
  background-attachment:fixed;
  display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; font-size:15px; line-height:1.55;
  touch-action:manipulation; /* 禁用双击缩放，连点切换技巧不会放大页面 */
}
#app { flex:1; overflow-y:auto; padding:20px 18px calc(var(--nav-h) + 40px); scroll-behavior:smooth; margin:0 auto; width:100%; max-width:760px; }
.view { display:none; }
.view.active { display:block; animation:fadeUp .25s cubic-bezier(.4,0,.2,1); }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes popIn { 0%{transform:scale(.9);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes flipIn { 0%{transform:rotateY(90deg);opacity:0} 100%{transform:rotateY(0);opacity:1} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

/* Nav */
nav {
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-top:1px solid var(--border);
  box-shadow:0 -4px 24px rgba(88,104,190,0.06);
  display:flex; justify-content:space-around; align-items:flex-start;
  z-index:100; padding:8px 4px env(safe-area-inset-bottom,8px);
}
nav .tab {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 10px; border:none; background:none; color:var(--text2);
  font-size:10px; cursor:pointer; font-family:var(--font); position:relative;
  transition:all 220ms ease; font-weight:500; border-radius:14px; min-width:56px;
}
nav .tab .icon { font-size:22px; line-height:1; transition:transform .2s; }
nav .tab:hover { color:var(--text); }
nav .tab.active { color:var(--primary); background:var(--primary-light); }
nav .tab.active .icon { transform:translateY(-2px); }
nav .tab .badge {
  position:absolute; top:2px; left:50%; margin-left:10px;
  background:var(--danger); color:#fff; font-size:10px; min-width:18px;height:18px;
  border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-weight:700; padding:0 5px; animation:popIn .3s;
}

/* Cards */
.card {
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:var(--radius); padding:18px 20px;
  border:1px solid var(--border); margin-bottom:14px;
  box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s;
}
.card-header { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.card-header .dot { width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0; }

/* Stats */
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
.stat-card {
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-sm); padding:16px 10px;
  text-align:center; border:1px solid var(--border);
  box-shadow:var(--shadow-soft);
}
.stat-card .num { font-size:30px; font-weight:800; letter-spacing:-1px; }
.stat-card .label { font-size:11px; color:var(--text2); margin-top:3px; font-weight:500; }
.stat-card.primary .num{color:var(--primary)}
.stat-card.success .num{color:var(--success)}
.stat-card.danger .num{color:var(--danger)}
.stat-card.warn .num{color:var(--warn)}

/* Buttons */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 20px; border-radius:var(--radius-sm);
  border:1px solid var(--border);
  font-size:15px; font-weight:600; cursor:pointer; transition:all 220ms ease;
  font-family:var(--font); width:100%; position:relative; overflow:hidden;
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow-soft);
}
.btn:hover { transform:translateY(-2px); opacity:.9; box-shadow:var(--shadow); }
.btn:active { transform:scale(.97); }
.btn-primary { background:color-mix(in srgb,var(--primary) 85%,transparent); color:#fff; border-color:rgba(255,255,255,0.4); }
.btn-primary:active { background:var(--primary-dark); }
.btn-surface { background:var(--surface); color:var(--text); border:1.5px solid var(--border); }
.btn-accent { background:color-mix(in srgb,var(--accent) 85%,transparent); color:#fff; border-color:rgba(255,255,255,0.4); }
.btn-danger { background:color-mix(in srgb,var(--danger) 85%,transparent); color:#fff; border-color:rgba(255,255,255,0.4); }
.btn-sm { padding:8px 16px; font-size:13px; width:auto; }
.btn-row { display:flex; gap:10px; }
.btn-row .btn { flex:1; }

/* Mode selector */
.mode-toggle {
  display:flex; background:var(--bg); border-radius:var(--radius-sm); padding:4px; gap:4px;
  border:1px solid var(--border);
}
.mode-toggle button {
  flex:1; padding:12px 8px; border:none; border-radius:9px; font-size:14px;
  font-weight:600; cursor:pointer; transition:all 220ms ease; font-family:var(--font);
  background:transparent; color:var(--text2);
}
.mode-toggle button:hover { background:rgba(255,255,255,0.3); }
.mode-toggle button.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-soft); }

/* Flashcard */
.flashcard-container {
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.flashcard {
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:var(--radius); border:1px solid var(--border);
  width:100%; max-width:480px; min-height:320px; display:flex;
  align-items:center; justify-content:center; cursor:pointer;
  position:relative; overflow:hidden; transition:all 220ms ease;
  box-shadow:var(--shadow);
}
.flashcard:hover { box-shadow:0 14px 36px rgba(88,104,190,0.16); }
.flashcard:active { border-color:var(--primary); }
.flashcard img { max-width:100%; max-height:300px; object-fit:contain; padding:12px; }
.flashcard .drug-name {
  font-size:36px; font-weight:800; text-align:center; padding:20px;
  animation:flipIn .35s; letter-spacing:2px;
}
.flashcard .reveal-hint {
  position:absolute; bottom:10px; right:14px;
  font-size:11px; color:var(--text2); opacity:.5; font-weight:500;
}
.flashcard .fav-btn {
  position:absolute; top:8px; right:12px; z-index:5;
  background:none; border:none; font-size:26px; cursor:pointer;
  color:var(--text2); opacity:.55; transition:all 220ms ease;
  padding:4px; line-height:1;
}
.flashcard .fav-btn.on { color:var(--star); opacity:1; }
.flashcard .fav-btn:hover { transform:scale(1.25); opacity:1; }
.fav-btn-modal.on { color:var(--star); border-color:var(--star); }

.answer-area {
  width:100%; max-width:480px; min-height:64px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-sm);
  border:1.5px dashed var(--primary); font-size:14px; color:var(--text2);
  cursor:pointer; transition:all 220ms ease; padding:18px; font-weight:500;
}
.answer-area:hover { background:rgba(255,255,255,0.6); }
.answer-area.revealed {
  border-style:solid; border-color:var(--success); background:var(--success-light);
  color:var(--text); font-size:14px; font-weight:500; animation:popIn .3s;
}
.answer-info .drug-big { font-size:26px; font-weight:800; letter-spacing:1px; }
.answer-info .drug-cat { font-size:12px; color:var(--primary); font-weight:600; margin-top:4px; }
.answer-info .drug-note { font-size:13px; color:var(--text2); margin-top:8px; line-height:1.6; }

/* Rate buttons */
.rate-btns { width:100%; max-width:480px; }
.rate-label { text-align:center; font-size:13px; color:var(--text2); margin-bottom:10px; font-weight:500; }
.rate-row { display:flex; gap:10px; }
.rate-wrong {
  flex:1; padding:16px; border-radius:var(--radius-sm); border:1.5px solid var(--danger);
  background:color-mix(in srgb,var(--danger-light) 72%,transparent);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  color:var(--danger); font-size:18px;
  font-weight:700; cursor:pointer; transition:all 220ms ease; font-family:var(--font);
  box-shadow:var(--shadow-soft);
}
.rate-right {
  flex:1; padding:16px; border-radius:var(--radius-sm); border:1.5px solid var(--success);
  background:color-mix(in srgb,var(--success-light) 72%,transparent);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  color:var(--success); font-size:18px;
  font-weight:700; cursor:pointer; transition:all 220ms ease; font-family:var(--font);
  box-shadow:var(--shadow-soft);
}
.rate-wrong:hover,.rate-right:hover { transform:translateY(-2px); opacity:.9; }
.rate-wrong:active,.rate-right:active { transform:scale(.95); }

/* Study layout */
.view.study-layout{
  display:flex; flex-direction:column; gap:14px;
  min-height:calc(100vh - var(--nav-h) - 64px);
  min-height:calc(100dvh - var(--nav-h) - 64px);
}
.study-top{ display:flex; align-items:center; gap:12px; }
.study-title{ flex:1; font-size:14px; font-weight:600; }
.study-count{ font-size:13px; color:var(--text2); font-variant-numeric:tabular-nums; }
.study-card-wrap{
  flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px;
  min-height:220px; padding:6px 0;
}
.study-actions{ display:flex; gap:10px; width:100%; max-width:480px; margin:0 auto; }
.study-actions .btn-rate{ flex:1; padding:14px 4px; font-size:14px; }
.study-actions .btn-back{ flex:0 0 auto; width:auto; padding:14px 18px; font-size:13px; }
.study-hint{ text-align:center; font-size:11px; color:var(--text2); margin-top:2px; }

.btn-forget{
  background:color-mix(in srgb,var(--danger) 12%,transparent);
  border:1.5px solid color-mix(in srgb,var(--danger) 55%,transparent);
  color:var(--danger);
}
.btn-remember{
  background:color-mix(in srgb,var(--success) 12%,transparent);
  border:1.5px solid color-mix(in srgb,var(--success) 55%,transparent);
  color:var(--success);
}
.btn:disabled{ opacity:.4; cursor:default; transform:none; box-shadow:none; }
.btn:disabled:hover{ opacity:.4; transform:none; }

/* Progress */
.progress-bar {
  height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-bottom:14px;
}
.progress-bar .fill { height:100%; background:var(--primary); border-radius:4px; transition:width .4s cubic-bezier(.4,0,.2,1); }

/* Browse */
.filter-scroll {
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;
}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip {
  flex-shrink:0; padding:8px 18px; border-radius:20px; border:1px solid var(--border);
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  font-size:13px; cursor:pointer; white-space:nowrap;
  transition:all 220ms ease; font-family:var(--font); color:var(--text); font-weight:500;
}
.filter-chip:hover { transform:translateY(-1px); }
.filter-chip.active { background:var(--primary); color:#fff; border-color:transparent; box-shadow:var(--shadow-soft); }

.browse-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media(min-width:480px){ .browse-grid{grid-template-columns:repeat(4,1fr)} }
@media(min-width:768px){ .browse-grid{grid-template-columns:repeat(6,1fr)} }
.browse-cell {
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-sm); overflow:hidden;
  border:1px solid var(--border); cursor:pointer; text-align:center;
  transition:all 220ms ease; box-shadow:var(--shadow-soft); position:relative;
}
.browse-cell:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.browse-cell:active{transform:scale(.96)}
.browse-cell img{width:100%;aspect-ratio:1;object-fit:contain;padding:10px;background:#fff}
.browse-cell .name{font-size:11px;padding:8px 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Settings */
.setting-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.setting-item:last-child{border-bottom:none}
.setting-item .label{font-size:14px;font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  font-size:18px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:var(--text);transition:all 220ms ease;
  box-shadow:var(--shadow-soft);
}
.stepper button:hover{transform:translateY(-2px)}
.stepper button:active{background:var(--primary-light);border-color:var(--primary)}
.stepper .val{font-size:16px;font-weight:700;min-width:28px;text-align:center}

.toggle-switch{
  width:50px;height:30px;border-radius:15px;border:none;
  background:var(--border);cursor:pointer;position:relative;transition:background .25s;
}
.toggle-switch.on{background:var(--primary)}
.toggle-switch::after{
  content:'';position:absolute;top:3px;left:3px;
  width:24px;height:24px;border-radius:50%;background:#fff;
  transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.toggle-switch.on::after{transform:translateX(20px)}

/* Drug list */
.drug-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.drug-row img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--border);flex-shrink:0}
.drug-row .info{flex:1;min-width:0}
.drug-row .info .name{font-size:14px;font-weight:600}
.drug-row .info .cat{font-size:11px;color:var(--text2)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;
}
.modal{
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border-radius:20px 20px 0 0;width:100%;
  max-width:500px;max-height:88vh;overflow-y:auto;padding:24px 20px;
  border:1px solid var(--border);border-bottom:none;
  box-shadow:0 -8px 30px rgba(88,104,190,0.12);
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
.modal h3{margin-bottom:18px;font-size:18px;font-weight:700}
.modal input,.modal select,.modal textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  font-size:14px;margin-bottom:12px;background:var(--surface);color:var(--text);font-family:var(--font);
}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}

/* Summary */
.summary-card{text-align:center;padding:32px 20px}
.summary-card .big-num{font-size:56px;font-weight:800;letter-spacing:-2px}
.summary-card .big-num.good{color:var(--success)}

/* Search */
.search-input{
  width:100%;padding:11px 16px;border-radius:24px;border:1px solid var(--border);
  font-size:14px;margin-bottom:12px;background:var(--surface);color:var(--text);font-family:var(--font);
}
.search-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;
  background:#1a2e2b;color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;font-weight:600;animation:popIn .25s;pointer-events:none;
}

/* Empty */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-state .icon{font-size:56px;margin-bottom:14px}

/* Category progress bars */
.cat-progress{margin-bottom:10px}
.cat-progress .cat-name{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between}
.cat-progress .cat-name span:last-child{color:var(--text2);font-weight:400;font-size:12px}
.cat-progress .bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.cat-progress .bar .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .5s}

/* Tip card */
.tip-card{
  background:var(--surface);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;cursor:pointer;min-height:150px;
  box-shadow:var(--shadow-soft);transition:box-shadow 220ms ease, transform 220ms ease;
}
.tip-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.tip-card .tip-title{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:6px}
.tip-card .tip-body{font-size:13px;color:var(--text);line-height:1.7}

/* Desktop */
@media(min-width:768px){
  #app{max-width:760px;padding-top:32px;padding-bottom:calc(var(--nav-h) + 56px)}
  nav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:24px 24px 0 0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .flashcard{min-height:340px}
}
</style>
</head>
<body>

<div id="app"></div>
<nav id="nav">
  <button class="tab active" data-view="dashboard"><span class="icon">📊</span>仪表盘</button>
  <button class="tab" data-view="learn"><span class="icon">📖</span>学习<span class="badge" id="dueBadge" style="display:none">0</span></button>
  <button class="tab" data-view="browse"><span class="icon">🔍</span>浏览</button>
  <button class="tab" data-view="settings"><span class="icon">⚙️</span>设置</button>
</nav>

<script>
// ========== DRUG DATA ==========
const DRUG_DATA = [
  {id:1,name:'地西泮',cat:'镇静催眠抗焦虑药'},
  {id:2,name:'苯巴比妥',cat:'镇静催眠抗焦虑药'},
  {id:3,name:'氯丙嗪',cat:'抗精神病药'},
  {id:4,name:'氟西汀',cat:'抗抑郁药'},
  {id:5,name:'哌替啶',cat:'镇痛药'},
  {id:6,name:'吗啡',cat:'镇痛药'},
  {id:7,name:'可待因',cat:'镇痛药'},

    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('drugs')){
        const ds=db.createObjectStore('drugs',{keyPath:'id'});
        ds.createIndex('cat','cat');
      }
      if(!db.objectStoreNames.contains('progress')){
        const ps=db.createObjectStore('progress',{keyPath:'drugId'});
        ps.createIndex('nextReview','nextReview');
        ps.createIndex('stage','stage');
      }
      if(!db.objectStoreNames.contains('logs')){
        db.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      }
      if(!db.objectStoreNames.contains('settings')){
        db.createObjectStore('settings',{keyPath:'key'});
      }
    };
    req.onsuccess=e=>{ db=e.target.result; seedIfNeeded().then(()=>resolve(db)); };
    req.onerror=()=>reject(req.error);
  });
}

async function seedIfNeeded(){
  const count=await new Promise(r=>{
    const tx=db.transaction('drugs','readonly');
    const req=tx.objectStore('drugs').count();
    req.onsuccess=()=>r(req.result);
  });
  if(count===0){
    const tx=db.transaction('drugs','readwrite');
    const store=tx.objectStore('drugs');
    DRUG_DATA.forEach(d=>store.add({...d,active:true,note:NOTE_MAP[d.id]||'',notes:''}));
    await new Promise(r=>{tx.oncomplete=r;});
  }
  // Init default settings
  const defaults={dailyNewCards:'10',dailyReviewLimit:'50',quizDirection:'both',darkMode:'false'};
  const tx=db.transaction('settings','readwrite');
  const ss=tx.objectStore('settings');
  for(const [k,v] of Object.entries(defaults)){
    const r=ss.get(k);
    r.onsuccess=()=>{if(r.result===undefined) ss.put({key:k,value:v});};
  }
  await new Promise(r=>{tx.oncomplete=r;});
}

function dbGet(store,key){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>r(req.result);});}
function dbGetAll(store){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>r(req.result);});}
function dbPut(store,val){return new Promise(r=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>r();});}
function dbDelete(store,key){return new Promise(r=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>r();});}
function dbGetByIndex(store,index,value){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).index(index).getAll(value);req.onsuccess=()=>r(req.result);});}
function dbGetAllByIndex(store,index,query){
  return new Promise(r=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).index(index).openCursor(query);
    const results=[];
    req.onsuccess=e=>{const cursor=e.target.result;if(cursor){results.push(cursor.value);cursor.continue();}else r(results);};
  });
}

// ========== SRS ENGINE ==========
// 按"日期"排期：今天学的卡今天不再复习，从第二天开始，间隔随复习次数递增（艾宾浩斯曲线）
const DAY_MS=86400000;
const LEARNING_STEPS=[1,2,4,7,15,30,60,120]; // 学习阶段间隔（天）
const GRADUATED_INTERVALS=[2,4,7,15,30,60,120]; // 毕业初始间隔（天）
function startOfDay(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}

function calcNextReview(progress,quality){
  const p={...progress};
  p.totalReviews=(p.totalReviews||0)+1;
  if(quality>=3){p.totalCorrect=(p.totalCorrect||0)+1;p.streak=(p.streak||0)+1;}
  else{p.totalIncorrect=(p.totalIncorrect||0)+1;p.streak=0;}

  const now=Date.now();
  p.lastReview=now;
  p.lastQuality=quality;

  if(quality<3){
    // Failed - reset to tomorrow
    p.stage=0;
    p.step=0;
    p.interval=1;
    p.easeFactor=Math.max(1.3,(p.easeFactor||2.5)-0.2);
    p.nextReview=startOfDay(now)+DAY_MS;
    return p;
  }

  p.easeFactor=p.easeFactor||2.5;
  if(quality>=4&&p.streak>=3) p.easeFactor=Math.min(3.0,p.easeFactor+0.15);

  if(p.stage<LEARNING_STEPS.length){
    // Learning phase
    p.step=(p.step||0)+1;
    if(p.step>=LEARNING_STEPS.length){
      p.stage=LEARNING_STEPS.length; // Graduated
      p.interval=Math.round(GRADUATED_INTERVALS[0]*p.easeFactor);
    }else{
      // 首次复习间隔1天（明天），之后按艾宾浩斯递增 2、4、7、15、30、60...
      p.interval=LEARNING_STEPS[p.step-1];
    }
  }else{
    // Graduated phase
    p.interval=Math.round(p.interval*p.easeFactor);
  }
  p.interval=Math.min(365,Math.max(1,p.interval));
  p.nextReview=startOfDay(now)+p.interval*DAY_MS;
  return p;
}

async function getDueCards(limit=50){
  const now=Date.now();
  const all=await dbGetAll('progress');
  const due=all.filter(p=>p.nextReview&&p.nextReview<=now).sort((a,b)=>a.nextReview-b.nextReview);
  return {cards:due.slice(0,limit),total:due.length};
}

// 明日待复习数：明天（0点-24点）到期的卡片数，今天学的明天就能在这里看到
async function getTomorrowCount(){
  const all=await dbGetAll('progress');
  const tomorrowStart=startOfDay(Date.now())+DAY_MS;
  const dayAfter=tomorrowStart+DAY_MS;
  return all.filter(p=>p.nextReview&&p.nextReview>=tomorrowStart&&p.nextReview<dayAfter).length;
}

async function getNewCards(limit=10){
  const allProgress=await dbGetAll('progress');
  const studied=new Set(allProgress.map(p=>p.drugId));
  const drugs=await dbGetAll('drugs');
  const fresh=drugs.filter(d=>d.active!==false&&!studied.has(d.id));
  // Shuffle
  for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]];}
  return fresh.slice(0,limit);
}

// ========== 屏幕常亮（仅背诵页生效） ==========
// Screen Wake Lock API: iOS Safari 16.4+ / Android Chrome 84+ 支持。
// 页面切到后台时浏览器会自动释放锁，所以切回前台要重新申请。
let wakeLock=null;     // 当前持有的 WakeLockSentinel
let wantAwake=false;   // 期望状态：是否停在背诵页
let wakeWarned=false;  // 不支持时只提示一次

async function acquireWakeLock(){
  if(!wantAwake) return;
  if(wakeLock&&!wakeLock.released) return; // 已持有且未失效，不用重复申请
  if(!('wakeLock' in navigator)) return;
  if(document.visibilityState!=='visible') return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{wakeLock=null;});
  }catch(err){
    wakeLock=null; // 低电量模式/省电模式等场景系统会拒绝
    if(!wakeWarned){
      wakeWarned=true;
      toast('⚠️ 屏幕常亮失败，请关闭「低电量模式」，或在系统设置里关掉「自动锁定」');
    }
  }
}

function releaseWakeLock(){
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
}

function setScreenAwake(on){
  wantAwake=on;
  if(!on){releaseWakeLock();return;}
  if(!('wakeLock' in navigator)){
    if(!wakeWarned){wakeWarned=true;toast('⚠️ 当前浏览器不支持屏幕常亮，请在系统设置中关闭「自动锁定」');}
    return;
  }
  acquireWakeLock();
}

// 从后台切回前台时重新申请（系统在页面隐藏时已自动释放）
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wantAwake) acquireWakeLock();
});

async function calcStreak(){
  const logs=await dbGetAll('logs');
  if(logs.length===0) return 0;
  const days=new Set(logs.map(l=>new Date(l.reviewedAt).toISOString().slice(0,10)));
  const sorted=[...days].sort().reverse();
  let streak=0;
  const today=new Date().toISOString().slice(0,10);
  const check=new Date(sorted[0]+'T00:00:00');
  const todayDate=new Date(today+'T00:00:00');
  if(check<todayDate&&check.getTime()<todayDate.getTime()-2*86400000) return 0;
  if(sorted[0]!==today&&sorted[0]!==yesterday()) return 0;
  const start=new Date((sorted[0]===today?today:yesterday())+'T00:00:00');
  for(let i=0;i<365;i++){
    const d=new Date(start.getTime()-i*86400000).toISOString().slice(0,10);
    if(days.has(d)) streak++; else break;
  }
  return streak;
}

async function startNewLearning(){
  const limit=parseInt((await dbGet('settings','dailyNewCards'))?.value||'10');
  const cards=await getNewCards(limit);
  if(cards.length===0){
    toast('🎉 所有卡片都已学完！');
    return;
  }
  studyCards=cards;
  studyIndex=0;
  studyRevealed=false;
  studySessionType='new';
  showView('learn');
  renderStudyCard();
}

async function startReview(){
  const {cards,total}=await getDueCards(50);
  if(cards.length===0){
    toast('✅ 暂无待复习卡片！');
    return;
  }
  // Resolve drug info
  const drugs=await dbGetAll('drugs');
  const drugMap={};
  drugs.forEach(d=>drugMap[d.id]=d);
  studyCards=cards.map(p=>({...p,drug:drugMap[p.drugId]||drugMap[p.id]}));
  studyIndex=0;
  studyRevealed=false;
  studySessionType='review';
  showView('learn');
  renderStudyCard();
}

function renderStudyCard(){
  if(studyIndex>=studyCards.length){
    renderStudySummary();
    return;
  }
  setScreenAwake(true); // 背诵页：保持屏幕常亮
  const card=studyCards[studyIndex];
  const drug=card.drug||card;
  const total=studyCards.length;
  const isReview=!!card.nextReview;
  const dirLabel=studyDirection==='i2n'?'看图识名':'看名识图';
  studyRevealed=false;

  app.innerHTML=`
  <div id="view-learn" class="view active study-layout">
    <!-- 顶部：返回 + 模式 + 进度 -->
    <div class="study-top">
      <button class="btn btn-sm btn-surface" onclick="showView('dashboard');renderDashboard();" aria-label="返回">←</button>

// 上一张 / 下一张：在本次会话内切换，不改变评分进度
function gotoCard(idx){
  if(idx<0||idx>=studyCards.length) return;
  studyIndex=idx;
  studyRevealed=false;
  renderStudyCard();
}
function prevCard(){ gotoCard(studyIndex-1); }
function nextCard(){ gotoCard(studyIndex+1); }

function revealAnswer(){
  if(studyRevealed) return;
  studyRevealed=true;
  const card=studyCards[studyIndex];
  const drug=card.drug||card;
  const area=document.getElementById('answerArea');
  const fc=document.getElementById('flashcard');
  const note=getNote(drug);

  if(studyDirection==='i2n'){
    area.innerHTML=`
      <div class="answer-info" style="animation:flipIn .35s">
        <div class="drug-big">${drug.name}</div>
        <div class="drug-cat">分类：${drug.cat}</div>
        ${note?`<div class="drug-note">${note}</div>`:''}
      </div>`;
    area.classList.add('revealed');
    fc.style.opacity='0.6';
  }else{
    area.innerHTML=`
      <div style="text-align:center;animation:flipIn .35s">
        <img src="${getDrugImage(drug)}" style="max-width:100%;max-height:230px;object-fit:contain">
        ${note?`<div class="drug-note" style="margin-top:6px">${note}</div>`:''}
      </div>`;
    area.classList.add('revealed');
  }
  const bf=document.getElementById('btnForget');
  const br=document.getElementById('btnRemember');
  if(bf) bf.disabled=false;
  if(br) br.disabled=false;
}

async function rateQuality(correct){
  const quality=correct?4:1; // 认识→4, 不认识→1
  const card=studyCards[studyIndex];
  const drugId=card.drug?.id||card.drugId||card.id;
  const drug=card.drug||card;
  const isReview=!!card.nextReview;

  // Get or init progress
  let progress=await dbGet('progress',drugId);
  if(!progress){
    progress={drugId,stage:0,step:0,easeFactor:2.5,interval:1,repetitions:0,streak:0,totalReviews:0,totalCorrect:0,totalIncorrect:0,nextReview:startOfDay(Date.now())+DAY_MS};
  }
  const updated=calcNextReview(progress,quality);
  await dbPut('progress',updated);

  // Log
  const logEntry={drugId,direction:studyDirection,quality,reviewedAt:Date.now(),isNew:!isReview};
  const tx=db.transaction('logs','readwrite');
  tx.objectStore('logs').add(logEntry);
  await new Promise(r=>{tx.oncomplete=r;});

  // Next card
  studyIndex++;
  studyRevealed=false;
  updateDueBadge();
  renderStudyCard();
}

async function changeSetting(key,delta){
  const s=await dbGet('settings',key);

  await dbPut('settings',{key,value:String(newVal)});
  const el=document.getElementById(key==='dailyNewCards'?'dailyNewVal':'dailyReviewVal');
  if(el) el.textContent=newVal;
}

async function toggleDarkMode(){
  const s=await dbGet('settings','darkMode');
  const isDark=s?.value==='true';
  const newVal=!isDark;
  await dbPut('settings',{key:'darkMode',value:String(newVal)});
  document.body.classList.toggle('dark',newVal);
  const btn=document.getElementById('darkToggle');
  if(btn) btn.classList.toggle('on',newVal);

async function exportData(){
  const data={drugs:await dbGetAll('drugs'),progress:await dbGetAll('progress'),logs:await dbGetAll('logs'),settings:await dbGetAll('settings'),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`drug-flashcard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('✅ 数据已导出');
}

async function importData(e){
  const file=e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data.drugs||!data.progress){throw new Error('Invalid format');}
    // Clear and re-import
    for(const store of ['drugs','progress','logs','settings']){
      const tx=db.transaction(store,'readwrite');
      tx.objectStore(store).clear();
      await new Promise(r=>{tx.oncomplete=r;});
    }
    for(const store of ['drugs','progress','settings']){
      const tx=db.transaction(store,'readwrite');
      const os=tx.objectStore(store);
      (data[store]||[]).forEach(item=>os.put(item));
      await new Promise(r=>{tx.oncomplete=r;});
    }
    // Logs
    if(data.logs){
      const tx=db.transaction('logs','readwrite');
      (data.logs||[]).forEach(item=>tx.objectStore('logs').add(item));
      await new Promise(r=>{tx.oncomplete=r;});
    }
    toast('✅ 数据已导入，请刷新页面');
    setTimeout(()=>location.reload(),1500);
  }catch(err){
    toast('❌ 导入失败: '+err.message);
  }
  e.target.value='';
}

async function resetProgress(){
  if(!confirm('确定要重置所有学习进度吗？此操作不可撤销！')) return;
  const tx=db.transaction(['progress','logs'],'readwrite');
  tx.objectStore('progress').clear();
  tx.objectStore('logs').clear();
  await new Promise(r=>{tx.oncomplete=r;});
  toast('🗑 进度已重置');
  renderDashboard();
}

    </div>
    <input class="search-input" placeholder="搜索药品..." value="${search}" oninput="filterDrugRows(this.value)">
    <div id="drugRowCount" style="font-size:13px;color:var(--text2);margin-bottom:8px">共 ${filtered.length} 种药品</div>
  `;

  filtered.forEach(d=>{
    html+=`
    <div class="drug-row">
      <img src="${getDrugImage(d)}" onerror="this.style.display='none'">
      <div class="info">
        <div class="name">${d.name} <span style="font-size:11px;color:var(--text2)">#${d.id}</span></div>
        <div class="cat">${d.cat} ${d.active===false?'· <span style=color:var(--danger)>已隐藏</span>':''}</div>
      </div>
      <button class="btn btn-sm btn-surface" onclick="editDrug(${d.id})">✏️</button>
      <button class="btn btn-sm btn-danger" onclick="deleteDrug(${d.id})">🗑</button>
    </div>`;
  });

  html+=`</div>`;
  app.innerHTML=html;
}

// 药品列表搜索：就地过滤已渲染的行，避免每次输入都重渲染导致失焦/跳动（也兼容中文输入法）
function filterDrugRows(q){
  q=q.trim();
  const rows=document.querySelectorAll('.drug-row');
  let visible=0;
  rows.forEach(row=>{
    const name=row.querySelector('.info .name').textContent;
    const cat=row.querySelector('.info .cat').textContent;
    const match=!q||name.includes(q)||cat.includes(q);
    row.style.display=match?'':'none';
    if(match) visible++;
  });
  const count=document.getElementById('drugRowCount');
  if(count) count.textContent=`共 ${visible} 种药品`;
}

async function deleteDrug(id){
  const drug=await dbGet('drugs',id);
  if(!drug) return;
  if(!confirm(`确定要删除「${drug.name}」吗？此操作不可撤销。`)) return;
  await dbDelete('drugs',id);
  // 同时清理该药品的学习进度，避免残留孤立数据
  const tx=db.transaction('progress','readwrite');
  tx.objectStore('progress').delete(id);
  await new Promise(r=>{tx.oncomplete=r;});
  toast('🗑 已删除');
  renderDrugEditor();
}

async function editDrug(id){
  const drug=await dbGet('drugs',id);
  if(!drug) return;
  const hasCustom=drug.customImage?'✅ 已有自定义图片':'';
  const html=`
  <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <h3>编辑药品 #${id}</h3>
      <div style="text-align:center;margin-bottom:12px">
        <img id="editPreview" src="${getDrugImage(drug)}" style="max-width:200px;max-height:160px;object-fit:contain;border-radius:8px" onerror="this.style.display='none'">
      </div>
      <label>药名</label>
      <input id="editName" value="${drug.name}">
      <label>分类</label>
      <select id="editCat">${ALL_CATEGORIES.map(c=>`<option value="${c}"${drug.cat===c?' selected':''}>${c}</option>`).join('')}<option value="__new__">➕ 新建分类...</option></select>
      <input id="editNewCat" placeholder="输入新分类名称" style="display:none;margin-top:4px">
      <label>更换图片 ${hasCustom}</label>
      <input type="file" id="editImage" accept="image/*" onchange="previewUpload(this,'editPreview')" style="margin-bottom:8px">
      <label>注释</label>
      <textarea id="editNotes" rows="2" placeholder="输入注释（翻卡时显示）">${getNote(drug)}</textarea>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-primary" onclick="saveDrug(${id})">保存</button>
        <button class="btn btn-surface" onclick="document.querySelector('.modal-overlay').remove()">取消</button>
      </div>
    </div>
  </div>`;
  const div=document.createElement('div');
  div.innerHTML=html;
  app.appendChild(div.firstElementChild);
  // Category change handler
  setTimeout(()=>{
    const sel=document.getElementById('editCat');
    sel.onchange=()=>{
      document.getElementById('editNewCat').style.display=sel.value==='__new__'?'block':'none';
    };
  },100);
}

async function saveDrug(id){
  const drug=await dbGet('drugs',id);
  drug.name=document.getElementById('editName').value;
  let cat=document.getElementById('editCat').value;
  if(cat==='__new__'){
    cat=document.getElementById('editNewCat').value.trim();
    if(!cat){toast('请输入新分类名称');return;}
    if(!ALL_CATEGORIES.includes(cat)) ALL_CATEGORIES.push(cat);
  }
  drug.cat=cat;
  drug.note=document.getElementById('editNotes').value.trim();
  drug.updatedAt=Date.now();
  // Handle image upload
  const fileInput=document.getElementById('editImage');
  if(fileInput.files[0]){
    drug.customImage=await fileToBase64(fileInput.files[0]);
  }
  await dbPut('drugs',drug);
  document.querySelector('.modal-overlay').remove();
  toast('✅ 已保存');
  renderDrugEditor();
}

function getDrugImage(drug){
  if(drug.customImage) return drug.customImage;
  return drug.id+'.png';
}

// 注释：优先自定义note → 旧notes字段 → 内置NOTE_MAP
function getNote(drug){
  if(!drug) return '';
  const n=drug.note||drug.notes||NOTE_MAP[drug.id]||'';
  return n;
}

// 收藏/取消收藏
async function toggleFavorite(id,btn,labelMode){
  const drug=await dbGet('drugs',id);
  if(!drug) return;
  drug.favorite=!drug.favorite;
  await dbPut('drugs',drug);
  if(btn){
    const on=drug.favorite;
    btn.classList.toggle('on',on);
    btn.innerHTML=labelMode?(on?'★ 已收藏':'☆ 收藏'):(on?'★':'☆');
  }
  return drug.favorite;
}

function previewUpload(input,previewId){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=document.getElementById(previewId);
    if(img){img.src=e.target.result;img.style.display='block';}
  };
  reader.readAsDataURL(file);
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function showAddDrug(){
  const maxId=Math.max(...(await dbGetAll('drugs')).map(d=>d.id),128)+1;
  const html=`
  <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <h3>添加新药品</h3>
      <div style="text-align:center;margin-bottom:12px">
        <img id="addPreview" src="" style="max-width:200px;max-height:160px;object-fit:contain;border-radius:8px;display:none">
      </div>
      <label>编号</label>
      <input id="addId" type="number" value="${maxId}" placeholder="自动生成">
      <label>药名</label>
      <input id="addName" placeholder="药品名称">
      <label>分类</label>
      <select id="addCat">${ALL_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}<option value="__new__">➕ 新建分类...</option></select>
      <input id="addNewCat" placeholder="输入新分类名称" style="display:none;margin-top:4px">
      <label>上传结构图片</label>
      <input type="file" id="addImage" accept="image/*" onchange="previewUpload(this,'addPreview')">
      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-primary" onclick="addNewDrug()">添加</button>
        <button class="btn btn-surface" onclick="document.querySelector('.modal-overlay').remove()">取消</button>
      </div>
    </div>
  </div>`;
  const div=document.createElement('div');
  div.innerHTML=html;
  app.appendChild(div.firstElementChild);
  setTimeout(()=>{
    const sel=document.getElementById('addCat');
    sel.onchange=()=>{
      document.getElementById('addNewCat').style.display=sel.value==='__new__'?'block':'none';
    };
  },100);
}

async function addNewDrug(){
  const id=parseInt(document.getElementById('addId').value);
  const name=document.getElementById('addName').value.trim();
  let cat=document.getElementById('addCat').value;
  if(cat==='__new__'){
    cat=document.getElementById('addNewCat').value.trim();
    if(!cat){toast('请输入新分类名称');return;}
    if(!ALL_CATEGORIES.includes(cat)) ALL_CATEGORIES.push(cat);
  }
  if(!id||!name){toast('请填写编号和药名');return;}
  const exists=await dbGet('drugs',id);
  if(exists&&exists.active!==false){toast('该编号已存在');return;}
  const newDrug={id,name,cat,active:true,notes:'',createdAt:Date.now()};
  // Handle image upload
  const fileInput=document.getElementById('addImage');
  if(fileInput.files[0]){
    newDrug.customImage=await fileToBase64(fileInput.files[0]);
  }
  await dbPut('drugs',newDrug);
  document.querySelector('.modal-overlay').remove();
  toast('✅ 已添加: '+name);
  renderDrugEditor();
}

// ========== UTILS ==========
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000);
}

// ========== NAVIGATION ==========
nav.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');
  if(!tab) return;
  const view=tab.dataset.view;
  showView(view);
  if(view==='dashboard') await renderDashboard();
  else if(view==='learn') await renderLearnMenu();
  else if(view==='browse') await renderBrowse();
  else if(view==='settings') await renderSettings();
});

// ========== INIT ==========
async function init(){
  try{
    await openDB();
    const darkMode=await dbGet('settings','darkMode');
    if(darkMode?.value==='true') document.body.classList.add('dark');
    await renderDashboard();
    await updateDueBadge();
  }catch(err){
    app.innerHTML=`<div class="empty-state"><div class="icon">⚠️</div><h3>初始化失败</h3><p style="color:var(--text2);margin-top:8px">请检查浏览器是否支持 IndexedDB<br>或尝试刷新页面</p><p style="font-size:12px;color:var(--text2);margin-top:4px">${err.message}</p></div>`;
  }
  // Register SW
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

async function updateDueBadge(){
  const {total}=await getDueCards(200);
  const badge=document.getElementById('dueBadge');
  if(badge){
    if(total>0){badge.textContent=total>99?'99+':total;badge.style.display='flex';}
    else{badge.style.display='none';}
  }
}
init();

// Keyboard shortcuts: ←→ 切换, 空格/回车 翻卡, 翻卡后 ←→/A/D 评分
document.addEventListener('keydown',e=>{
  if(currentView!=='learn') return;
  if(studyRevealed){
    if(e.key==='ArrowLeft'||e.key==='a'){rateQuality(false);}
    else if(e.key==='ArrowRight'||e.key==='d'){rateQuality(true);}
  }else{
    if(e.key==='ArrowLeft'){prevCard();}
    else if(e.key==='ArrowRight'){nextCard();}
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();revealAnswer();}
  }
});

// Handle back button
window.addEventListener('hashchange',()=>{
  const v=location.hash.slice(1);
  if(v&&['dashboard','learn','browse','settings'].includes(v)) showView(v);
});
</script>
