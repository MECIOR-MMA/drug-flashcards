<style>
:root {
  --bg: #f2f7f5; --surface: #fff; --text: #1a2e2b; --text2: #6b7f7a;
  --primary: #0d9488; --primary-dark: #0f766e; --primary-light: #e6f7f5;
  --accent: #6366f1; --accent-light: #eef2ff;
  --danger: #ef4444; --danger-light: #fef2f2;
  --success: #10b981; --success-light: #ecfdf5;
  --warn: #f59e0b; --warn-light: #fffbeb;
  --border: #e4ece9; --radius: 16px; --radius-sm: 10px;
  --nav-h: 68px; --font: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',system-ui,sans-serif;
}
body.dark {
  --bg: #0c1a17; --surface: #152522; --text: #e2edeb; --text2: #7a918c;
  --primary: #2dd4bf; --primary-dark: #14b8a6; --primary-light: #0d2e28;
  --border: #1e3d35;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:var(--font); background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none; font-size:15px; line-height:1.5;
}
#app { flex:1; overflow-y:auto; padding:12px 14px calc(var(--nav-h) + 24px); scroll-behavior:smooth; }
.view { display:none; }
.view.active { display:block; animation:fadeUp .25s cubic-bezier(.4,0,.2,1); }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes popIn { 0%{transform:scale(.9);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes flipIn { 0%{transform:rotateY(90deg);opacity:0} 100%{transform:rotateY(0);opacity:1} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

/* Nav */
nav {
  position:fixed; bottom:0; left:0; right:0; height:var(--nav-h);
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; justify-content:space-around; align-items:flex-start;
  z-index:100; padding:6px 4px env(safe-area-inset-bottom,6px);
}
nav .tab {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 10px; border:none; background:none; color:var(--text2);
  font-size:10px; cursor:pointer; font-family:var(--font); position:relative;
  transition:all .2s; font-weight:500; border-radius:12px; min-width:56px;
}
nav .tab .icon { font-size:22px; line-height:1; transition:transform .2s; }
nav .tab.active { color:var(--primary); }
nav .tab.active .icon { transform:translateY(-2px); }
nav .tab .badge {
  position:absolute; top:2px; left:50%; margin-left:10px;
  background:var(--danger); color:#fff; font-size:10px; min-width:18px;height:18px;
  border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-weight:700; padding:0 5px; animation:popIn .3s;
}

/* Cards */
.card {
  background:var(--surface); border-radius:var(--radius); padding:18px;
  border:1px solid var(--border); margin-bottom:14px;
  transition:border-color .2s;
}
.card-header { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.card-header .dot { width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0; }

/* Stats */
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
.stat-card {
  background:var(--surface); border-radius:var(--radius-sm); padding:16px 10px;
  text-align:center; border:1px solid var(--border);
}
.stat-card .num { font-size:30px; font-weight:800; letter-spacing:-1px; }
.stat-card .label { font-size:11px; color:var(--text2); margin-top:3px; font-weight:500; }
.stat-card.primary .num{color:var(--primary)}
.stat-card.success .num{color:var(--success)}
.stat-card.danger .num{color:var(--danger)}
.stat-card.warn .num{color:var(--warn)}

/* Buttons */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 20px; border-radius:var(--radius-sm); border:none;
  font-size:15px; font-weight:600; cursor:pointer; transition:all .18s;
  font-family:var(--font); width:100%; position:relative; overflow:hidden;
}
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:active { background:var(--primary-dark); }
.btn-surface { background:var(--surface); color:var(--text); border:1.5px solid var(--border); }
.btn-accent { background:var(--accent); color:#fff; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-sm { padding:8px 16px; font-size:13px; width:auto; }
.btn-row { display:flex; gap:10px; }
.btn-row .btn { flex:1; }

/* Mode selector */
.mode-toggle {
  display:flex; background:var(--bg); border-radius:var(--radius-sm); padding:4px; gap:4px;
}
.mode-toggle button {
  flex:1; padding:12px 8px; border:none; border-radius:8px; font-size:14px;
  font-weight:600; cursor:pointer; transition:all .2s; font-family:var(--font);
  background:transparent; color:var(--text2);
}
.mode-toggle button.active { background:var(--surface); color:var(--text); }

/* Flashcard */
.flashcard-container {
  display:flex; flex-direction:column; align-items:center; gap:16px;
}
.flashcard {
  background:var(--surface); border-radius:var(--radius); border:1.5px solid var(--border);
  width:100%; max-width:420px; min-height:280px; display:flex;
  align-items:center; justify-content:center; cursor:pointer;
  position:relative; overflow:hidden; transition:all .2s;
}
.flashcard:active { border-color:var(--primary); }
.flashcard img { max-width:100%; max-height:300px; object-fit:contain; padding:12px; }
.flashcard .drug-name {
  font-size:36px; font-weight:800; text-align:center; padding:20px;
  animation:flipIn .35s; letter-spacing:2px;
}
.flashcard .reveal-hint {
  position:absolute; bottom:10px; right:14px;
  font-size:11px; color:var(--text2); opacity:.5; font-weight:500;
}

.answer-area {
  width:100%; max-width:420px; min-height:64px;
  display:flex; align-items:center; justify-content:center;
  background:var(--primary-light); border-radius:var(--radius-sm);
  border:2px dashed var(--primary); font-size:14px; color:var(--text2);
  cursor:pointer; transition:all .25s; padding:18px; font-weight:500;
}
.answer-area.revealed {
  border-style:solid; border-color:var(--success); background:var(--success-light);
  color:var(--text); font-size:30px; font-weight:800; animation:popIn .3s;
}

/* Rate buttons */
.rate-btns { width:100%; max-width:420px; }
.rate-label { text-align:center; font-size:13px; color:var(--text2); margin-bottom:10px; font-weight:500; }
.rate-row { display:flex; gap:10px; }
.rate-wrong {
  flex:1; padding:16px; border-radius:var(--radius-sm); border:2px solid var(--danger);
  background:var(--danger-light); color:var(--danger); font-size:18px;
  font-weight:700; cursor:pointer; transition:all .15s; font-family:var(--font);
}
.rate-right {
  flex:1; padding:16px; border-radius:var(--radius-sm); border:2px solid var(--success);
  background:var(--success-light); color:var(--success); font-size:18px;
  font-weight:700; cursor:pointer; transition:all .15s; font-family:var(--font);
}
.rate-wrong:active,.rate-right:active { transform:scale(.95); }

/* Progress */
.progress-bar {
  height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-bottom:14px;
}
.progress-bar .fill { height:100%; background:var(--primary); border-radius:4px; transition:width .4s cubic-bezier(.4,0,.2,1); }

/* Browse */
.filter-scroll {
  display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none;
}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip {
  flex-shrink:0; padding:7px 16px; border-radius:20px; border:1.5px solid var(--border);
  background:var(--surface); font-size:13px; cursor:pointer; white-space:nowrap;
  transition:all .2s; font-family:var(--font); color:var(--text); font-weight:500;
}
.filter-chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }

.browse-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media(min-width:480px){ .browse-grid{grid-template-columns:repeat(4,1fr)} }
@media(min-width:768px){ .browse-grid{grid-template-columns:repeat(6,1fr)} }
.browse-cell {
  background:var(--surface); border-radius:var(--radius-sm); overflow:hidden;
  border:1px solid var(--border); cursor:pointer; text-align:center;
  transition:all .15s;
}
.browse-cell:active{transform:scale(.96)}
.browse-cell img{width:100%;aspect-ratio:1;object-fit:contain;padding:10px;background:#fff}
.browse-cell .name{font-size:11px;padding:6px 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browse-cell .stars{font-size:9px;padding-bottom:6px}

/* Settings */
.setting-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.setting-item:last-child{border-bottom:none}
.setting-item .label{font-size:14px;font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--surface);font-size:18px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:var(--text);transition:all .15s;
}
.stepper button:active{background:var(--primary-light);border-color:var(--primary)}
.stepper .val{font-size:16px;font-weight:700;min-width:28px;text-align:center}

.toggle-switch{
  width:50px;height:30px;border-radius:15px;border:none;
  background:var(--border);cursor:pointer;position:relative;transition:background .25s;
}
.toggle-switch.on{background:var(--primary)}
.toggle-switch::after{
  content:'';position:absolute;top:3px;left:3px;
  width:24px;height:24px;border-radius:50%;background:#fff;
  transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.toggle-switch.on::after{transform:translateX(20px)}

/* Drug list */
.drug-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.drug-row img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--border);flex-shrink:0}
.drug-row .info{flex:1;min-width:0}
.drug-row .info .name{font-size:14px;font-weight:600}
.drug-row .info .cat{font-size:11px;color:var(--text2)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;
}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;width:100%;
  max-width:500px;max-height:88vh;overflow-y:auto;padding:24px 20px;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
.modal h3{margin-bottom:18px;font-size:18px;font-weight:700}
.modal input,.modal select,.modal textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  font-size:14px;margin-bottom:12px;background:var(--bg);color:var(--text);font-family:var(--font);
}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--primary)}

/* Summary */
.summary-card{text-align:center;padding:32px 20px}
.summary-card .big-num{font-size:56px;font-weight:800;letter-spacing:-2px}
.summary-card .big-num.good{color:var(--success)}

/* Search */
.search-input{
  width:100%;padding:11px 16px;border-radius:24px;border:1.5px solid var(--border);
  font-size:14px;margin-bottom:12px;background:var(--bg);color:var(--text);font-family:var(--font);
}
.search-input:focus{outline:none;border-color:var(--primary)}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;
  background:#1a2e2b;color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;font-weight:600;animation:popIn .25s;pointer-events:none;
}

/* Empty */
.empty-state{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-state .icon{font-size:56px;margin-bottom:14px}

/* Category progress bars */
.cat-progress{margin-bottom:10px}
.cat-progress .cat-name{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between}
.cat-progress .cat-name span:last-child{color:var(--text2);font-weight:400;font-size:12px}
.cat-progress .bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.cat-progress .bar .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .5s}

/* Tip card */
.tip-card{
  background:var(--accent-light);border:1px solid #c7d2fe;border-radius:var(--radius);
  padding:16px;margin-bottom:12px;
}
.tip-card .tip-title{font-weight:700;font-size:14px;color:var(--accent);margin-bottom:6px}
.tip-card .tip-body{font-size:13px;color:var(--text);line-height:1.6}

/* Desktop */
@media(min-width:768px){
  #app{max-width:640px;margin:0 auto;padding-top:24px}
  nav{max-width:640px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}
}
</style>

// ========== INDEXEDDB ==========
const DB_NAME='drugFlashcard', DB_VER=1;
let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('drugs')){
        const ds=db.createObjectStore('drugs',{keyPath:'id'});
        ds.createIndex('cat','cat');
      }
      if(!db.objectStoreNames.contains('progress')){
        const ps=db.createObjectStore('progress',{keyPath:'drugId'});
        ps.createIndex('nextReview','nextReview');
        ps.createIndex('stage','stage');
      }
      if(!db.objectStoreNames.contains('logs')){
        db.createObjectStore('logs',{keyPath:'id',autoIncrement:true});
      }
      if(!db.objectStoreNames.contains('settings')){
        db.createObjectStore('settings',{keyPath:'key'});
      }
    };
    req.onsuccess=e=>{ db=e.target.result; seedIfNeeded().then(()=>resolve(db)); };
    req.onerror=()=>reject(req.error);
  });
}

async function seedIfNeeded(){
  const count=await new Promise(r=>{
    const tx=db.transaction('drugs','readonly');
    const req=tx.objectStore('drugs').count();
    req.onsuccess=()=>r(req.result);
  });
  if(count===0){
    const tx=db.transaction('drugs','readwrite');
    const store=tx.objectStore('drugs');
    DRUG_DATA.forEach(d=>store.add({...d,active:true,notes:''}));
    await new Promise(r=>{tx.oncomplete=r;});
  }
  // Init default settings
  const defaults={dailyNewCards:'10',dailyReviewLimit:'50',quizDirection:'both',darkMode:'false'};
  const tx=db.transaction('settings','readwrite');
  const ss=tx.objectStore('settings');
  for(const [k,v] of Object.entries(defaults)){
    const r=ss.get(k);
    r.onsuccess=()=>{if(r.result===undefined) ss.put({key:k,value:v});};
  }
  await new Promise(r=>{tx.oncomplete=r;});
}

function dbGet(store,key){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>r(req.result);});}
function dbGetAll(store){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>r(req.result);});}
function dbPut(store,val){return new Promise(r=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(val);tx.oncomplete=()=>r();});}
function dbDelete(store,key){return new Promise(r=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>r();});}
function dbGetByIndex(store,index,value){return new Promise(r=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).index(index).getAll(value);req.onsuccess=()=>r(req.result);});}
function dbGetAllByIndex(store,index,query){
  return new Promise(r=>{
    const tx=db.transaction(store,'readonly');
    const req=tx.objectStore(store).index(index).openCursor(query);
    const results=[];
    req.onsuccess=e=>{const cursor=e.target.result;if(cursor){results.push(cursor.value);cursor.continue();}else r(results);};
  });
}

// ========== SRS ENGINE ==========
const LEARNING_STEPS=[1,10,60,1440,2880,5760,10080,20160,43200]; // minutes
const GRADUATED_INTERVALS=[1,2,4,7,15,30,60,120]; // days

function calcNextReview(progress,quality){
  const p={...progress};
  p.totalReviews=(p.totalReviews||0)+1;
  if(quality>=3){p.totalCorrect=(p.totalCorrect||0)+1;p.streak=(p.streak||0)+1;}
  else{p.totalIncorrect=(p.totalIncorrect||0)+1;p.streak=0;}

  const now=Date.now();
  p.lastReview=now;
  p.lastQuality=quality;

  if(quality<3){
    // Failed - reset
    p.stage=0;
    p.step=0;
    p.interval=LEARNING_STEPS[0];
    p.easeFactor=Math.max(1.3,(p.easeFactor||2.5)-0.2);
    p.nextReview=now+p.interval*60000;
    return p;
  }

  p.easeFactor=p.easeFactor||2.5;
  if(quality>=4&&p.streak>=3) p.easeFactor=Math.min(3.0,p.easeFactor+0.15);

  if(p.stage<LEARNING_STEPS.length){
    // Learning phase
    p.step=(p.step||0)+1;
    if(p.step>=LEARNING_STEPS.length){
      p.stage=LEARNING_STEPS.length; // Graduated
      p.interval=Math.round(GRADUATED_INTERVALS[0]*p.easeFactor);
    }else{
      p.interval=LEARNING_STEPS[p.step];
    }
  }else{
    // Graduated phase
    p.interval=Math.round(p.interval*p.easeFactor);
  }
  p.interval=Math.min(365,Math.max(1,p.interval));
  p.nextReview=now+p.interval*60000;
  return p;
}

async function getDueCards(limit=50){
  const now=Date.now();
  const all=await dbGetAll('progress');
  const due=all.filter(p=>p.nextReview&&p.nextReview<=now).sort((a,b)=>a.nextReview-b.nextReview);
  return {cards:due.slice(0,limit),total:due.length};
}

async function getNewCards(limit=10){
  const allProgress=await dbGetAll('progress');
  const studied=new Set(allProgress.map(p=>p.drugId));
  const drugs=await dbGetAll('drugs');
  const fresh=drugs.filter(d=>d.active!==false&&!studied.has(d.id));
  // Shuffle
  for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]];}
  return fresh.slice(0,limit);
}

async function calcStreak(){
  const logs=await dbGetAll('logs');
  if(logs.length===0) return 0;
  const days=new Set(logs.map(l=>new Date(l.reviewedAt).toISOString().slice(0,10)));
  const sorted=[...days].sort().reverse();
  let streak=0;
  const today=new Date().toISOString().slice(0,10);
  const check=new Date(sorted[0]+'T00:00:00');
  const todayDate=new Date(today+'T00:00:00');
  if(check<todayDate&&check.getTime()<todayDate.getTime()-2*86400000) return 0;
  if(sorted[0]!==today&&sorted[0]!==yesterday()) return 0;
  const start=new Date((sorted[0]===today?today:yesterday())+'T00:00:00');
  for(let i=0;i<365;i++){
    const d=new Date(start.getTime()-i*86400000).toISOString().slice(0,10);
    if(days.has(d)) streak++; else break;
  }
  return streak;
}

    <div style="font-size:10px;color:var(--text2);margin-top:8px">点击切换技巧 →</div>
  </div>

  </div>`;

  window._tips=tips;
  window._tipIndex=tips.indexOf(randomTip);
}
function nextTip(){
  const tips=window._tips||[];
  window._tipIndex=((window._tipIndex||0)+1)%tips.length;
  const t=tips[window._tipIndex];
  const card=document.getElementById('tipCard');
  if(card) card.innerHTML=`
    <div class="tip-title">${t.icon} ${t.title}</div>
    <div class="tip-body">${t.body}</div>
    <div style="font-size:10px;color:var(--text2);margin-top:8px">点击切换技巧 →</div>`;
}

async function startNewLearning(){
  const limit=parseInt((await dbGet('settings','dailyNewCards'))?.value||'10');
  const cards=await getNewCards(limit);
  if(cards.length===0){
    toast('🎉 所有卡片都已学完！');
    return;
  }
  studyCards=cards;
  studyIndex=0;
  studyRevealed=false;
  showView('learn');

}

async function startReview(){
  const {cards,total}=await getDueCards(50);
  if(cards.length===0){
    toast('✅ 暂无待复习卡片！');
    return;
  }
  // Resolve drug info
  const drugs=await dbGetAll('drugs');
  const drugMap={};
  drugs.forEach(d=>drugMap[d.id]=d);
  studyCards=cards.map(p=>({...p,drug:drugMap[p.drugId]||drugMap[p.id]}));
  studyIndex=0;
  studyRevealed=false;
  showView('learn');
  renderStudyCard();
}

function renderStudyCard(){
  if(studyIndex>=studyCards.length){
    renderStudySummary();
    return;
  }
  const card=studyCards[studyIndex];
  const drug=card.drug||card;
  const total=studyCards.length;
  const isReview=!!card.nextReview;
  const dirLabel=studyDirection==='i2n'?'看图识名':'看名识图';
  studyRevealed=false;

  app.innerHTML=`

          <div class="reveal-hint">点击查看药名 →</div>
        `:`
          <div class="drug-name">${drug.name}</div>
          <div class="reveal-hint">点击查看结构 →</div>
        `}
      </div>

      <div class="answer-area" id="answerArea" onclick="revealAnswer()">
        ${studyDirection==='i2n'?'点击此处显示药名':'点击此处显示结构图'}

        <div class="rate-row">
          <button class="rate-wrong" onclick="rateQuality(false)">✗ 不认识</button>
          <button class="rate-right" onclick="rateQuality(true)">✓ 认识</button>
        </div>

      </div>

function revealAnswer(){
  if(studyRevealed) return;
  studyRevealed=true;
  const card=studyCards[studyIndex];
  const drug=card.drug||card;
  const area=document.getElementById('answerArea');
  const fc=document.getElementById('flashcard');

  if(studyDirection==='i2n'){
    area.innerHTML=`<span style="font-size:28px;font-weight:700;animation:flipIn .35s">${drug.name}</span>`;
    area.classList.add('revealed');
    fc.style.opacity='0.6';
  }else{
    area.innerHTML=`<img src="${getDrugImage(drug)}" style="max-width:100%;max-height:260px;object-fit:contain;animation:flipIn .35s">`;
    area.classList.add('revealed');
  }
  document.getElementById('qualitySection').style.display='block';
}

async function rateQuality(correct){
  const quality=correct?4:1; // 认识→4, 不认识→1
  const card=studyCards[studyIndex];
  const drugId=card.drug?.id||card.drugId||card.id;
  const drug=card.drug||card;
  const isReview=!!card.nextReview;

  // Get or init progress
  let progress=await dbGet('progress',drugId);
  if(!progress){
    progress={drugId,stage:0,step:0,easeFactor:2.5,interval:LEARNING_STEPS[0],repetitions:0,streak:0,totalReviews:0,totalCorrect:0,totalIncorrect:0,nextReview:Date.now()+LEARNING_STEPS[0]*60000};
  }
  const updated=calcNextReview(progress,quality);
  await dbPut('progress',updated);

  // Log
  const logEntry={drugId,direction:studyDirection,quality,reviewedAt:Date.now(),isNew:!isReview};
  const tx=db.transaction('logs','readwrite');
  tx.objectStore('logs').add(logEntry);
  await new Promise(r=>{tx.oncomplete=r;});

  // Next card
  studyIndex++;
  studyRevealed=false;
  updateDueBadge();
  renderStudyCard();
}

async function exportData(){
  const data={drugs:await dbGetAll('drugs'),progress:await dbGetAll('progress'),logs:await dbGetAll('logs'),settings:await dbGetAll('settings'),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`drug-flashcard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('✅ 数据已导出');
}

async function importData(e){
  const file=e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data.drugs||!data.progress){throw new Error('Invalid format');}
    // Clear and re-import
    for(const store of ['drugs','progress','logs','settings']){
      const tx=db.transaction(store,'readwrite');
      tx.objectStore(store).clear();
      await new Promise(r=>{tx.oncomplete=r;});
    }
    for(const store of ['drugs','progress','settings']){
      const tx=db.transaction(store,'readwrite');
      const os=tx.objectStore(store);
      (data[store]||[]).forEach(item=>os.put(item));
      await new Promise(r=>{tx.oncomplete=r;});
    }
    // Logs
    if(data.logs){
      const tx=db.transaction('logs','readwrite');
      (data.logs||[]).forEach(item=>tx.objectStore('logs').add(item));
      await new Promise(r=>{tx.oncomplete=r;});
    }
    toast('✅ 数据已导入，请刷新页面');
    setTimeout(()=>location.reload(),1500);
  }catch(err){
    toast('❌ 导入失败: '+err.message);
  }
  e.target.value='';
}

async function resetProgress(){
  if(!confirm('确定要重置所有学习进度吗？此操作不可撤销！')) return;
  const tx=db.transaction(['progress','logs'],'readwrite');
  tx.objectStore('progress').clear();
  tx.objectStore('logs').clear();
  await new Promise(r=>{tx.oncomplete=r;});
  toast('🗑 进度已重置');
  renderDashboard();
}

async function saveDrug(id){
  const drug=await dbGet('drugs',id);
  drug.name=document.getElementById('editName').value;
  let cat=document.getElementById('editCat').value;
  if(cat==='__new__'){
    cat=document.getElementById('editNewCat').value.trim();
    if(!cat){toast('请输入新分类名称');return;}
    if(!ALL_CATEGORIES.includes(cat)) ALL_CATEGORIES.push(cat);
  }
  drug.cat=cat;
  drug.notes=document.getElementById('editNotes').value;
  drug.updatedAt=Date.now();
  // Handle image upload
  const fileInput=document.getElementById('editImage');
  if(fileInput.files[0]){
    drug.customImage=await fileToBase64(fileInput.files[0]);
  }
  await dbPut('drugs',drug);
  document.querySelector('.modal-overlay').remove();
  toast('✅ 已保存');
  renderDrugEditor();
}

function getDrugImage(drug){
  if(drug.customImage) return drug.customImage;
  return drug.id+'.png';
}

function previewUpload(input,previewId){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=document.getElementById(previewId);
    if(img){img.src=e.target.result;img.style.display='block';}
  };
  reader.readAsDataURL(file);
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

  if(!id||!name){toast('请填写编号和药名');return;}
  const exists=await dbGet('drugs',id);
  if(exists&&exists.active!==false){toast('该编号已存在');return;}
  const newDrug={id,name,cat,active:true,notes:'',createdAt:Date.now()};
  // Handle image upload
  const fileInput=document.getElementById('addImage');
  if(fileInput.files[0]){
    newDrug.customImage=await fileToBase64(fileInput.files[0]);
  }
  await dbPut('drugs',newDrug);
  document.querySelector('.modal-overlay').remove();
  toast('✅ 已添加: '+name);
  renderDrugEditor();
}

// ========== UTILS ==========
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000);
}

// ========== NAVIGATION ==========
nav.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');
  if(!tab) return;
  const view=tab.dataset.view;
  showView(view);
  if(view==='dashboard') await renderDashboard();
  else if(view==='learn') await renderLearnMenu();
  else if(view==='browse') await renderBrowse();
  else if(view==='settings') await renderSettings();
});

// ========== INIT ==========
async function init(){
  try{
    await openDB();
    const darkMode=await dbGet('settings','darkMode');
    if(darkMode?.value==='true') document.body.classList.add('dark');
    await renderDashboard();
    await updateDueBadge();
  }catch(err){
    app.innerHTML=`<div class="empty-state"><div class="icon">⚠️</div><h3>初始化失败</h3><p style="color:var(--text2);margin-top:8px">请检查浏览器是否支持 IndexedDB<br>或尝试刷新页面</p><p style="font-size:12px;color:var(--text2);margin-top:4px">${err.message}</p></div>`;
  }
  // Register SW
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

async function updateDueBadge(){
  const {total}=await getDueCards(200);
  const badge=document.getElementById('dueBadge');
  if(badge){
    if(total>0){badge.textContent=total>99?'99+':total;badge.style.display='flex';}
    else{badge.style.display='none';}
  }
}
init();

// Keyboard shortcuts for quality rating
document.addEventListener('keydown',e=>{
  if(currentView==='learn'&&studyRevealed){
    if(e.key==='ArrowLeft'||e.key==='a'){rateQuality(false);}
    if(e.key==='ArrowRight'||e.key==='d'){rateQuality(true);}
  }
  if(e.key===' '&&currentView==='learn'&&!studyRevealed){
    e.preventDefault();
    revealAnswer();
  }
});

// Handle back button
window.addEventListener('hashchange',()=>{
  const v=location.hash.slice(1);
  if(v&&['dashboard','learn','browse','settings'].includes(v)) showView(v);
});
</script>
